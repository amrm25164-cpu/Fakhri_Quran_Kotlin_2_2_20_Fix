name: Build Fakhri Quran APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Ensure Android Gradle Plugin meets the minimum required by current Flutter.
      - name: Set compatible Android Gradle Plugin and Gradle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          settings = Path("android/settings.gradle")
          if settings.exists():
              text = settings.read_text()
              text, n = re.subn(
                  r'(id ["\\']com\\.android\\.application["\\'] version ["\\'])[0-9.]+(["\\'] apply false)',
                  r'\\g<1>8.11.1\\g<2>', text)
              if n == 0:
                  text = text.replace('id "com.android.application" version "8.6.1" apply false',
                                      'id "com.android.application" version "8.11.1" apply false')
              settings.write_text(text)
          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              text = wrapper.read_text()
              text = re.sub(r'gradle-[0-9.]+-(?:all|bin)\\.zip',
                            'gradle-8.14.3-all.zip', text)
              wrapper.write_text(text)
          PY
      - name: Show Android toolchain versions
        run: |
          grep -nE 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle || true
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: fakhri-quran-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
